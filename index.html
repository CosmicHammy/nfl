<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Football League</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5493905150735571"
     crossorigin="anonymous"></script>
     <link rel="icon" href="assets/favicon.svg" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #ffa500; /* Default background color changed to orange */
            transition: background 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        header {
            text-align: center;
            padding: 20px 0;
        }
        header img {
            width: 200px;
            height: auto;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }
        .button-container button {
            background: white;
            color: #333;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .button-container button:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .ad-container {
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="assets/nfllogo.png" alt="Nova Football League Logo">
            <h1>Welcome to Nova Football League</h1>
            <p>Select a league:</p>
        </header>
        <main>
            <div class="button-container">
                <button onclick="window.location.href='https://nfl3.leaguerepublic.com/'">Junior League</button>
                <button onclick="window.location.href='https://nfljnr.leaguerepublic.com/'">Senior League</button>
            </div>
            
            <!-- Google AdSense Ad -->
            <div class="ad-container">
                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-client="ca-pub-5493905150735571"
                    data-ad-slot="1234567890"  <!-- Replace with real Ad Slot ID on April 5 -->
                    data-ad-format="auto"
                    data-full-width-responsive="true">
                </ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </main>
    </div>
</body>
</html>
